name: NIKO Backend CI

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-backend:
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: niko_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d niko_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      NIKO_TEST_DATABASE_URL: postgresql://niko_app:niko_test_password@localhost:5432/niko_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Prepare PostgreSQL RLS test role and schema
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d niko_test -c "CREATE ROLE niko_app LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'niko_test_password';"
          psql -h localhost -U postgres -d niko_test -c "GRANT CONNECT ON DATABASE niko_test TO niko_app;"
          psql -h localhost -U postgres -d niko_test -f migrations/001_multi_tenant_core.sql
          psql -h localhost -U postgres -d niko_test -c "GRANT USAGE ON SCHEMA public TO niko_app; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO niko_app; GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO niko_app;"
          psql -h localhost -U postgres -d niko_test -c "GRANT USAGE ON SCHEMA niko_private TO niko_app; GRANT EXECUTE ON FUNCTION niko_private.niko_resolve_user_id(TEXT, TEXT) TO niko_app;"
      - name: Run backend tests
        run: pytest -q
