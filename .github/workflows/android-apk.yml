name: Build NIKO Android APK (Secondary)

on:
  # Android is a secondary target. Run this workflow manually when needed.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.nikoai --project-name niko_ai /tmp/niko_android

      - name: Add Android platform to app
        run: cp -R /tmp/niko_android/android mobile/android

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: mobile
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: niko-ai-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
